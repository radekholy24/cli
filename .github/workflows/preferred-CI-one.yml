# A workflow that performs continuous integration of a branch to be pulled to the "preferred" branch.

on:
  workflow_dispatch:
    inputs:
      commit_repository:
        type: 'string'
        default: ''
        description: 'The owner and the repository of the commit to be tested (empty string means this repository)'
      commit_ref:
        type: 'string'
        default: 'preferred'
        description: 'The commit to be tested (e.g. a branch name or a commit SHA)'
      run_name_suffix:
        type: 'string'
        default: ''
        description: "Suffix to the run's name"

run-name: 'Continuous integration of the "${{ inputs.commit_repository }}" repository at "${{ inputs.commit_ref }}"${{ inputs.run_name_suffix }}'

env:
  commit_repository: ${{ inputs.commit_repository || github.repository }}

permissions:
  contents: read

jobs:
  CI:
    strategy:
      matrix:
        runner: [ubuntu-20.04, ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', 'graalpy-24.1', 'pypy-3.10', 'pypy-3.11']
        exclude:
          - runner: ubuntu-22.04-arm
            python: 'pypy-3.10'
          - runner: ubuntu-22.04-arm
            python: 'pypy-3.11'
          - runner: ubuntu-24.04-arm
            python: 'pypy-3.10'
          - runner: ubuntu-24.04-arm
            python: 'pypy-3.11'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set Python ${{ matrix.python }} up
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Checkout ${{ env.commit_repository }} at ${{ inputs.commit_ref }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.commit_repository }}
          ref: ${{ inputs.commit_ref }}
      - name: Generate required locale
        run: |
          /usr/bin/env printf "
          C.UTF-8 UTF-8
          en_US.ISO-8859-15 ISO-8859-15
          en_US.UTF-8 UTF-8
          et_EE.ISO-8859-15 ISO-8859-15
          zh_TW.UTF-8 UTF-8
          " | /usr/bin/env sudo /usr/bin/env tee -a /etc/locale.gen
          /usr/bin/env sudo /usr/bin/env locale-gen
      - name: Install the project
        run: /usr/bin/env python -m pip --verbose install .
      - name: Remove everything except tests
        run: /usr/bin/env find . ! -path . ! -path ./tests ! -path './tests/*' -print -delete
      - name: Run the tests
        run: /usr/bin/env python -m unittest --verbose
